<!DOCTYPE html>
<html>

<head>

    <title>Error</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Poppins,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{

            background:#1e293b;
            padding:40px;
            border-radius:15px;
            width:500px;
            text-align:center;

        }

        h1{

            color:#ef4444;

        }

        p{

            color:#cbd5e1;

        }

        a{

            display:inline-block;
            margin-top:20px;
            background:#2563eb;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="card">

<h1>⚠ Something went wrong</h1>

<p>{{error}}</p>

<a href="/">Go Back</a>

</div>

</body>

</html>
