<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Completed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,#2563eb 0%,transparent 35%),
    radial-gradient(circle at bottom right,#7c3aed 0%,transparent 35%),
    linear-gradient(135deg,#0f172a,#111827,#1e293b);

    color:white;
}

.card{

    width:450px;

    padding:45px;

    text-align:center;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 25px rgba(59,130,246,.2),
    0 0 80px rgba(124,58,237,.12);

    animation:pop .6s ease;
}

@keyframes pop{

    from{

        transform:scale(.85);
        opacity:0;

    }

    to{

        transform:scale(1);
        opacity:1;

    }

}

.success-icon{

    font-size:75px;

    color:#22c55e;

    margin-bottom:20px;
}

h1{

    margin-bottom:15px;

    font-size:30px;
}

p{

    color:#cbd5e1;

    margin-bottom:35px;

    line-height:1.7;
}

.btn{

    display:block;

    width:100%;

    text-decoration:none;

    padding:15px;

    border-radius:12px;

    font-weight:600;

    margin-bottom:15px;

    transition:.3s;
}

.download{

    background:#2563eb;

    color:white;
}

.download:hover{

    background:#1d4ed8;

    transform:translateY(-3px);
}

.home{

    background:#22c55e;

    color:white;
}

.home:hover{

    background:#16a34a;

    transform:translateY(-3px);
}

.footer{

    margin-top:25px;

    font-size:13px;

    color:#94a3b8;
}

    </style>

</head>

<body>

<div class="card">

    <div class="success-icon">
        <i class="bi bi-check-circle-fill"></i>
    </div>

    <h1>Prediction Completed</h1>

    <p>

        Your wafer fault prediction has been completed successfully.

        Click below to download the prediction results.

    </p>

    <a href="/download" class="btn download">
        <i class="bi bi-download"></i>
        Download Prediction File
    </a>

    <a href="/" class="btn home">
        <i class="bi bi-arrow-repeat"></i>
        Predict Another File
    </a>

    <div class="footer">
        Sensor Fault Detection using Machine Learning
    </div>

</div>

</body>
</html>
